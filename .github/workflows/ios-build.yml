name: Expo Update

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  update:
    name: Publish to Expo Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: |
          eas update --branch preview --message "Auto-update from push" --non-interactive

      - name: Post update link
        if: success()
        run: |
          echo "Update published! Open Expo Go on your iPhone and scan the QR code from your project dashboard."
          echo "Dashboard: https://expo.dev/projects/temp_videoforme"
