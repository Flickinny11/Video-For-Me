name: iOS Build and Deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - preview
          - production

jobs:
  build:
    name: EAS Build for iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile || 'simulator' }} --non-interactive

      - name: Post build link
        if: success()
        run: |
          echo "Build submitted! Check your Expo dashboard for the build status."
          echo "Dashboard: https://expo.dev/projects/temp_videoforme/builds"
